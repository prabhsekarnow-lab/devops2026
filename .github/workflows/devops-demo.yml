name: SN DevOps Change Velocity Demo

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Simulate Build
        run: echo "Build complete - artifact ready for deployment"

  change-request:
    name: Create ServiceNow Change Request
    needs: build
    runs-on: ubuntu-latest
    outputs:
      change-request-number: ${{ steps.create_change.outputs.change-request-number }}
    steps:
      - name: ServiceNow DevOps - Change
        id: create_change
        uses: ServiceNow/servicenow-devops-change@v6.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'Create ServiceNow Change Request'
          change-request: '{"setCloseCode":"true","autoCloseChange":true,"attributes":{"short_description":"Automated Deployment - Demo App via GitHub Actions","description":"Change triggered automatically through DevOps Change Velocity pipeline","implementation_plan":"Execute deployment via GitHub Actions pipeline","backout_plan":"Revert commit via GitHub rollback","test_plan":"Post-deployment smoke test validation","chg_model":{"name":"DevOps"}}}'

  deploy:
    name: Deploy Application
    needs: change-request
    runs-on: ubuntu-latest
    steps:
      - name: Simulate Deployment
        run: echo "Deployment complete - application is live"
      - name: ServiceNow DevOps - Update Change
        uses: ServiceNow/servicenow-devops-update-change@v3.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'Deploy Application'
          change-request-number: ${{ needs.change-request.outputs.change-request-number }}
          change-request-details: '{"state":"3","close_code":"successful","close_notes":"Deployment completed successfully via GitHub Actions pipeline"}'
